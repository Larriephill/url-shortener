name: ci-dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  plan-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC
      contents: read

    env:
      TF_WORKING_DIR: terraform
      AWS_REGION: eu-west-2
      TF_VAR_stage: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show workflow context (temporary)
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "ref=$GITHUB_REF"
          echo "repository=$GITHUB_REPOSITORY"

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416162027738:role/url-dev-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -recursive -check

      - name: Terraform init (remote backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -upgrade

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -var="stage=${{ env.TF_VAR_stage }}"

      - name: Smoke test (POST/GET)
        env:
          API_URL: ${{ secrets.DEV_API_URL }}
        run: |
          bash verify.sh "$API_URL"
