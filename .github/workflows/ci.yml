name: ci-dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_WORKING_DIR: terraform
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          additional_args: --no-color --soft-fail

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          quiet: true
          soft_fail: true

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: eu-west-2
      TABLE: urls_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements-dev.txt

      # Sanity step to verify the handler file that CI is using
      - name: Sanity show handler version
        run: |
          python - <<'PY'
          import importlib, sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), "lambda"))
          h = importlib.import_module("handler")
          print("HANDLER FILE:", h.__file__)
          print("HAS _parse_body:", hasattr(h, "_parse_body"))
          try:
              with open(h.__file__, "r", encoding="utf-8") as f:
                  head = "".join(f.readlines()[:20])
          except Exception as e:
              head = f"<unable to read file: {e}>"
          print("HANDLER HEAD:\n", head)
          PY

      - name: Run pytest
        env:
          PYTHONPATH: ./lambda
        run: pytest -q

  plan-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TF_WORKING_DIR: terraform
      AWS_REGION: eu-west-2
      TF_VAR_stage: dev
      TF_IN_AUTOMATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform fmt (check only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -recursive -check

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416162027738:role/url-dev-gha-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init (remote backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -upgrade

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -var="stage=${{ env.TF_VAR_stage }}"

      - name: Read API URL from state
        id: tfout
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: echo "api=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test (POST/GET)
        env:
          API_URL: ${{ steps.tfout.outputs.api }}
        run: bash verify.sh "$API_URL"
