name: deploy-dev

on:
  workflow_dispatch: {}   # run manually from Actions tab

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev         # requires approval; gets env secrets: DEV_API_URL
    concurrency:
      group: deploy-dev      # prevent parallel applies
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    env:
      TF_WORKING_DIR: terraform
      AWS_REGION: eu-west-2
      TF_VAR_stage: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        
      - name: Show OIDC claims (temporary)
        permissions:
          id-token: write
          contents: read
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            core.info(JSON.stringify(claims, null, 2));        

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416162027738:role/url-dev-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply (dev)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var="stage=${{ env.TF_VAR_stage }}"

      - name: Smoke test
        env:
          API_URL: ${{ secrets.DEV_API_URL }}
        run: bash verify.sh "$API_URL"
