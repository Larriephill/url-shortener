name: deploy-dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: terraform
  AWS_REGION: eu-west-2
  TF_VAR_stage: dev
  TF_IN_AUTOMATION: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev   # <-- drives OIDC subject to environment:dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS (OIDC, APPLY)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416162027738:role/url-dev-gha-apply
          aws-region: ${{ env.AWS_REGION }}

      # Quick sanity: who am I?
      - name: STS caller identity
        run: aws sts get-caller-identity

      - name: Terraform init (remote backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -upgrade

      # Prove backend WRITE (Put/DeleteObject) safely
      - name: Backend write test
        run: |
          echo ok > /tmp/oidc_write_test.txt
          aws s3 cp /tmp/oidc_write_test.txt s3://urlshortenerlarriephill/_oidc_test_${{ github.run_id }}.txt
          aws s3 rm s3://urlshortenerlarriephill/_oidc_test_${{ github.run_id }}.txt

      # Non-destructive apply just to refresh state (will be no-op if no drift)
      - name: Terraform apply (refresh-only)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -refresh-only -auto-approve -input=false
